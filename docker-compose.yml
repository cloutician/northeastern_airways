services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northeastern_airways
    # Host 5433 avoids clashing with a local Windows Postgres on 5432 (common cause of "wrong password")
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d northeastern_airways"]
      interval: 2s
      timeout: 3s
      retries: 30
